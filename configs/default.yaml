specimens_dir: specimens
scenarios_dir: scenarios
results_dir: results
# Stable mock artifact directory: results/pilot/
run_id: pilot

provider: mock
model: mock-v1
temperature: 0.0
max_tokens: 512
seed: 42

# Primary v2 specimens (RP control is opt-in via configs/rp_control.yaml)
specimen_ids:
  - truth_over_agreement
  - calibrated_uncertainty
  - principle_under_authority

suites:
  - say
  - use
  - pressure

run_faithfulness: true
fracture_on:
  - out
  - reverses

use_llm_judge: false

# Ablation arm: character | no_character | opposite_character
ablation_mode: character
bootstrap_resamples: 1000
