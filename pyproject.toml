[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "character-hold"
version = "0.1.0"
description = "Character-hold AI-safety evaluation framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Federico Cavaletto" }]
dependencies = [
  "pydantic>=2.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "openai>=1.40",
  "anthropic>=0.34",
  "rich>=13.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "fpdf2>=2.8",
]

[project.scripts]
character-hold = "character_hold.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
